<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Church Roster{% endblock %}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --ink: #26344A;
            --paper: #FBF8F3;
            --panel: #FFFFFF;
            --gold: #B8862F;
            --gold-dark: #966D26;
            --sage: #4F7359;
            --sage-bg: #EAF1EC;
            --clay: #A8402F;
            --clay-bg: #F7E9E6;
            --amber: #B8862F;
            --amber-bg: #FBF0DE;
            --line: #E4DED2;
            --text: #2A2A28;
            --text-quiet: #8A8272;
        }

        * { box-sizing: border-box; }

        body {
            font-family: 'Inter', -apple-system, sans-serif;
            background: var(--paper);
            color: var(--text);
            margin: 0;
            display: flex;
            min-height: 100vh;
        }

        a { color: var(--gold-dark); text-decoration: none; }
        a:hover { color: var(--ink); }

        /* ---------- Sidebar ---------- */

        .sidebar {
            width: 220px;
            background: var(--ink);
            color: var(--paper);
            padding: 28px 0;
            flex-shrink: 0;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
	position: sticky;
	top: 0;
	height: 100vh;
	align-self: flex-start;
	overflow-y: auto;
        }

        .sidebar h1 {
            font-family: 'Fraunces', serif;
            font-size: 1.3rem;
            font-weight: 600;
            margin: 0 0 32px 0;
            padding: 0 24px;
        }

        .sidebar nav a {
            display: block;
            color: rgba(251, 248, 243, 0.85);
            padding: 10px 24px;
            font-size: 0.92rem;
        }

        .sidebar nav a:hover, .sidebar nav a.active {
            background: rgba(251, 248, 243, 0.08);
            color: #fff;
        }

        .sidebar-footer {
            padding: 16px 24px 0;
            border-top: 1px solid rgba(251, 248, 243, 0.15);
            margin-top: 16px;
        }

        .sidebar-user {
            font-size: 0.8rem;
            color: rgba(251, 248, 243, 0.6);
            margin: 0 0 8px 0;
        }

        .sidebar-logout {
            background: transparent;
            border: 1px solid rgba(251, 248, 243, 0.3);
            color: var(--paper);
            font-size: 0.8rem;
            padding: 6px 14px;
            border-radius: 4px;
            cursor: pointer;
        }

        .sidebar-logout:hover {
            background: rgba(251, 248, 243, 0.1);
        }

        /* ---------- Main content ---------- */

        .main {
            flex: 1;
            padding: 36px 44px;
            max-width: 900px;
        }

        h2 {
            font-family: 'Fraunces', serif;
            font-weight: 600;
            font-size: 1.6rem;
            margin: 0 0 6px 0;
        }

        .page-subtitle {
            color: var(--text-quiet);
            margin: 0 0 28px 0;
        }

        /* ---------- Cards / panels ---------- */

        .panel {
            background: var(--panel);
            border: 1px solid var(--line);
            border-radius: 8px;
            padding: 24px;
            margin-bottom: 24px;
        }

        .panel h3 {
            font-family: 'Fraunces', serif;
            font-size: 1.1rem;
            margin: 0 0 16px 0;
        }

        /* ---------- Tables ---------- */

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th, td {
            text-align: left;
            padding: 10px 8px;
            border-bottom: 1px solid var(--line);
            font-size: 0.92rem;
        }

        th {
            color: var(--text-quiet);
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.04em;
            font-weight: 600;
        }

        /* ---------- Forms ---------- */

        form.inline-form {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            align-items: end;
            margin-top: 16px;
        }

        form.inline-form .field {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        form.inline-form label {
            font-size: 0.78rem;
            color: var(--text-quiet);
        }

        input, select, textarea {
            font-family: 'Inter', sans-serif;
            border: 1px solid var(--line);
            border-radius: 4px;
            padding: 8px 10px;
            font-size: 0.9rem;
        }

        textarea { min-width: 180px; }

        input[type="checkbox"] {
            width: auto;
            padding: 0;
            border: none;
            margin-right: 6px;
        }

        .checkbox-list ul {
            list-style: none;
            padding: 0;
            margin: 0;
        }

        .checkbox-list li {
            padding: 4px 0;
        }

        /* ---------- Buttons ---------- */

        button, .btn {
            font-family: 'Inter', sans-serif;
            font-size: 0.88rem;
            font-weight: 500;
            padding: 9px 18px;
            border-radius: 4px;
            border: none;
            cursor: pointer;
            display: inline-block;
        }

        .btn-primary { background: var(--gold); color: #fff; }
        .btn-primary:hover { background: var(--gold-dark); color: #fff; }

        .btn-secondary { background: transparent; color: var(--ink); border: 1px solid var(--line); }
        .btn-secondary:hover { background: var(--paper); }

        .btn-danger { background: transparent; color: var(--clay); border: 1px solid var(--clay); padding: 5px 10px; font-size: 0.8rem; }
        .btn-danger:hover { background: var(--clay); color: #fff; }

        .btn-small { padding: 5px 10px; font-size: 0.8rem; }

        /* ---------- Status badges ---------- */

        .badge {
            display: inline-block;
            padding: 3px 12px;
            border-radius: 999px;
            font-size: 0.78rem;
            font-weight: 600;
        }
        .badge.pending { background: var(--amber-bg); color: var(--amber); }
        .badge.approved { background: var(--sage-bg); color: var(--sage); }
        .badge.declined { background: var(--clay-bg); color: var(--clay); }

        /* ---------- Messages ---------- */

        .messages { list-style: none; padding: 0; margin: 0 0 20px 0; }
        .messages li {
            padding: 10px 16px;
            border-radius: 4px;
            margin-bottom: 8px;
            font-size: 0.9rem;
        }
        .messages li.success { background: var(--sage-bg); color: var(--sage); }
        .messages li.error { background: var(--clay-bg); color: var(--clay); }
        .messages li.info { background: var(--amber-bg); color: var(--amber); }

        .empty {
            color: var(--text-quiet);
            font-style: italic;
            font-size: 0.9rem;
            padding: 8px 0;
        }

        /* ---------- Drag and drop (order of service) ---------- */

        .drag-handle {
            cursor: grab;
            color: var(--text-quiet);
            width: 24px;
            text-align: center;
        }

        #order-of-service-list tr.sortable-ghost {
            opacity: 0.4;
            background: var(--paper);
        }

        /* ---------- Assign row (per-role assignment) ---------- */

        .assign-row {
            display: flex;
            align-items: center;
            gap: 16px;
            flex-wrap: wrap;
            padding: 10px 0;
            border-bottom: 1px solid var(--line);
        }

        .assign-row:last-child {
            border-bottom: none;
        }

        .assign-row-label {
            min-width: 160px;
            display: flex;
            flex-direction: column;
            gap: 2px;
        }

        .assign-row-actions {
            display: flex;
            gap: 8px;
        }

        .assign-row-actions button[disabled] {
            opacity: 0.6;
            cursor: default;
        }

        .assign-row-form {
            margin-top: 0 !important;
        }
    </style>
</head>
<body>
    <div class="sidebar">
        <h1>Church Roster</h1>
        <nav>
            <a href="{% url 'dashboard' %}" class="{% block nav_dashboard %}{% endblock %}">Service Weeks</a>
            <a href="{% url 'volunteer_list' %}" class="{% block nav_volunteers %}{% endblock %}">Volunteers</a>
            <a href="{% url 'role_list' %}" class="{% block nav_roles %}{% endblock %}">Roles</a>
            <a href="{% url 'email_template_edit' %}" class="{% block nav_email_template %}{% endblock %}">Email Template</a>
            {% if user.is_superuser %}
            <a href="{% url 'user_list' %}" class="{% block nav_users %}{% endblock %}">Logins</a>
            {% endif %}
        </nav>
        <div class="sidebar-footer">
            <p class="sidebar-user">{{ user.username }}</p>
            <form method="post" action="{% url 'logout' %}">
                {% csrf_token %}
                <button type="submit" class="sidebar-logout">Log out</button>
            </form>
        </div>
    </div>
    <div class="main">
        {% if messages %}
        <ul class="messages">
            {% for message in messages %}
                <li class="{{ message.tags }}">{{ message }}</li>
            {% endfor %}
        </ul>
        {% endif %}
        {% block content %}{% endblock %}
    </div>
</body>
</html>
